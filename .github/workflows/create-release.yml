# نام ورک‌فلو که در تب Actions گیت‌هاب نمایش داده می‌شود
name: Create Release on Tag Push

# تعریف رویدادی که این اکشن را فعال می‌کند
on:
  push:
    tags:
      - 'v*' # اکشن فقط زمانی اجرا می‌شود که تگی با پیشوند 'v' پوش شود

# تعریف جاب‌ها (مراحل اجرایی)
jobs:
  release:
    # استفاده از آخرین نسخه اوبونتو برای اجرای اکشن
    runs-on: ubuntu-latest
    
    # تعریف دسترسی‌های لازم برای این جاب
    # برای ساخت رلیز، دسترسی 'write' به محتوای ریپازیتوری لازم است
    permissions:
      contents: write
      
    steps:
      # مرحله اول: کدهای ریپازیتوری را دانلود می‌کند (checkout)
      - name: Checkout code
        uses: actions/checkout@v4

      # مرحله دوم: با استفاده از یک اکشن آماده، رلیز را ایجاد می‌کند
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # نام رلیز به صورت خودکار از نام تگ خوانده می‌شود (مثلا: Release v0.0.5)
          name: Release ${{ github.ref_name }}
          
          # توضیحات رلیز را می‌توانید در اینجا بنویسید
          # یا از محتوای یک فایل مانند CHANGELOG.md بخوانید
          # body_path: CHANGELOG.md 
          body: |
            New release based on tag ${{ github.ref_name }}.
            Check the CHANGELOG.md for more details.