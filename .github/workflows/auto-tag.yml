# نام ورک‌فلو
name: Auto Tag from Commit

# این اکشن با هر پوش روی شاخه main فعال می‌شود
on:
  push:
    branches:
      - main # یا نام شاخه اصلی شما مانند master

jobs:
  tag:
    runs-on: ubuntu-latest
    # این جاب فقط زمانی اجرا می‌شود که در متن کامیت عبارت "release:" وجود داشته باشد
    if: "contains(github.event.head_commit.message, 'release:')"
    permissions:
      contents: write # برای ساختن و پوش کردن تگ، دسترسی write لازم است

    steps:
      # مرحله ۱: کدها را دانلود می‌کند
      - name: Checkout Code
        uses: actions/checkout@v4

      # مرحله ۲: نسخه را از متن کامیت استخراج کرده و تگ را می‌سازد
      - name: Create and Push Tag
        run: |
          # دریافت متن کامل کامیت
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # با استفاده از یک عبارت منظم (Regex)، شماره نسخه را پیدا می‌کند
          # مثال: release: v1.2.3
          if [[ "$COMMIT_MSG" =~ release:[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            # نسخه پیدا شده را در متغیر TAG ذخیره می‌کند
            TAG="${BASH_REMATCH[1]}"
            echo "Found tag $TAG in commit message."
            
            # تنظیمات git برای کامپیوتر مجازی اکشن
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # ساخت و پوش کردن تگ
            git tag $TAG
            git push origin $TAG
            
            echo "Successfully created and pushed tag $TAG."
          else
            echo "No valid release tag found in commit message."
          fi